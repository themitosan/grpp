name: Build

on:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci

    - name: Compile GRPP
      run: npm run build --if-present

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: GRPP
        path: ./Build/grpp.tgz
